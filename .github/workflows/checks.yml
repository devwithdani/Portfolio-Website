name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/check-secrets.mjs --history
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx tsc --noEmit
      - run: npm run build
